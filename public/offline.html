<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Sin conexión · Mi Música</title>
  <style>
    :root { color-scheme: dark; }
    body { align-items: center; background: #111827; color: #f8fafc; display: flex; font-family: system-ui, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; text-align: center; }
    main { max-width: 400px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin: 0 0 12px; }
    p { color: #cbd5e1; line-height: 1.55; margin: 0 0 24px; }
    button { background: #22d3ee; border: 0; border-radius: 8px; color: #082f49; cursor: pointer; font: inherit; font-weight: 700; padding: 10px 16px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">📀</div>
    <h1>Estás sin conexión</h1>
    <p>Vuelve a conectarte para cargar la aplicación. Si ya abriste tu biblioteca anteriormente, intenta volver a la página principal para ver los datos guardados.</p>
    <button type="button" onclick="window.location.reload()">Reintentar</button>
  </main>
</body>
</html>
